name: Playwright Example

on:
  schedule:
    - cron: '50 21 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**/playwright-examples/**'
      - 'pom.*'
  pull_request:
    paths:
      - '**/playwright-examples/**'
      - 'pom.*'

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: "temurin"
      - uses: axel-op/googlejavaformat-action@v4
        with:
          args: "--replace"
          files: "playwright-examples/**/*.java"
          skip-commit: true
      - name: Print diffs
        if: success() || failure()
        run: git --no-pager diff --exit-code

  standalone:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: "temurin"
      - name: Example
        timeout-minutes: 30
        run: cd ./playwright-examples && mvn test -Dtest=StandaloneTest -Dsurefire.parallel=1 -Dsurefire.rerunFailingTestsCount=2
      - name: Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Standalone Test Report
          path: playwright-examples/target/surefire-reports/*.xml
          reporter: java-junit

  suite:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [ chromium, firefox, webkit ]
    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: "temurin"
      - name: Example
        timeout-minutes: 30
        run: cd ./playwright-examples && mvn test -Dsauce.browser.name=${{ matrix.browser }} -Dsurefire.rerunFailingTestsCount=2
      - name: Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Suite Test Report (${{ matrix.browser }})
          path: playwright-examples/target/surefire-reports/*.xml
          reporter: java-junit
